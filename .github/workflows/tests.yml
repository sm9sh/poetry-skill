name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional stress dictionary
        run: pip install --no-deps ukrainian-word-stress marisa-trie
      - name: Run test suites
        run: python tests/run_tests.py --all
      - name: Mirror is in sync
        run: |
          python tests/sync_ecosystem.py
          git diff --exit-code -- .agents/skills || (echo "::error::.agents/skills is out of date — run python tests/sync_ecosystem.py" && exit 1)
